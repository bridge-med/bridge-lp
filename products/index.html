<style>
.cat-head{max-width:var(--max);margin:0 auto clamp(30px,4vh,44px)}
.cat-head .n{font:600 11px/1 var(--en);letter-spacing:0.2em;color:var(--dawn);margin-bottom:12px;display:block}
.cat-head h2{font-family:var(--mincho);font-weight:600;font-size:clamp(21px,3vw,30px);line-height:1.7}
.cat-head p{font-size:13px;color:var(--ink-3);margin-top:8px;max-width:560px}
.prod-grid{max-width:var(--max);margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:960px){.prod-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.prod-grid{grid-template-columns:1fr}}
.prod-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);transition:all .35s var(--ease)}
a.prod-card:hover{transform:translateY(-4px);border-color:var(--blue-soft)}
.prod-num{font:600 9.5px/1 var(--en);letter-spacing:0.16em;color:var(--ink-4)}
.prod-name{font-family:var(--mincho);font-weight:600;font-size:18px;line-height:1.5}
.prod-jp{font-size:11px;color:var(--ink-3);letter-spacing:.04em}
.prod-p{font-size:12px;line-height:2;color:var(--ink-2);flex:1}
.prod-link{font:600 10.5px/1 var(--en);letter-spacing:0.08em;color:var(--blue);display:inline-flex;gap:6px}
a.prod-card:hover .prod-link{gap:10px}
</style>
</head>
<body data-root="../" data-page="products">

<script defer>
// ================================================================
// プロダクトデータ(足せば増える。cat は CATS のキー)
// ================================================================
window.addEventListener('DOMContentLoaded', () => {
  const CATS = [
    { id: 'management', t: '経営・運営', p: '数字を「責める道具」から「対話の入口」へ。現場と経営が同じ画面を見るためのツール。' },
    { id: 'learning', t: '学習・教育', p: '学びの入口を、続けられる形で。ゲームも模試も、リハビリテーション思考の教材。' },
    { id: 'casual', t: '診断・ライト', p: '登録不要・数分で試せる、軽い入口。' },
    { id: 'free', t: '無料配布', p: 'まず触ってみたい方へ。' },
  ];
  const PRODUCTS = [
    { cat: 'management', name: 'RehaBoard', jp: 'リハボード', href: '../rehaboard/index.html',
      p: 'リハビリ部門の運営を、1画面で。月選択・期間切替・KPIカスタマイズ。' },
    { cat: 'management', name: 'MedBoard', jp: 'メドボード', href: '../medboard/index.html',
      p: '外来クリニックの患者フローを、2施設横並びで。「異変に気づく」のが目的。' },
    { cat: 'management', name: 'HireBoard', jp: 'ハイヤーボード', href: '../hire-board/index.html',
      p: '医療機関の採用をカンバンで。9紹介会社・職種別フィー自動計算。' },
    { cat: 'management', name: 'InterviewKit', jp: '面接官の手帖', href: '../interview-kit/index.html',
      p: '構造化面接ツール。職種×レベルで質問自動生成、事実と印象を分けて記録。' },
    { cat: 'management', name: 'ConsultSim', jp: 'コンサルトシム', href: '../consult-simulator/index.html',
      p: '診察オペレーション設計シミュレーター。1診/2診×曜日カスタム×グループ同期。' },
    { cat: 'management', name: 'RoundNote', jp: '本部長の巡回手帖', href: '../round-note/index.html',
      p: '複数施設の宿題・決定・気づきを1冊に。訪問前に「今日のアジェンダ」が立ち上がる。' },
    { cat: 'learning', name: 'キャリアログ', jp: 'iOSアプリ', href: '../daily-app/index.html',
      p: '日々の仕事と学びを記録し、職務経歴書・面接・1on1に活かす。続けられる仕組みの実験場。' },
    { cat: 'learning', name: 'Clinic Town 3D', jp: 'クリニックタウン3D', href: '../clinic-flow-3d/index.html',
      p: '遊ぶだけで外来経営が身につくSimCity風シミュレーション。算定項目まで実態準拠。' },
    { cat: 'learning', name: 'HIM Quiz', jp: '診療情報管理士 模試', href: '../him-quiz/index.html',
      p: '全12章・360問。模擬試験モード・章別正答率・間違い蓄積まで。' },
    { cat: 'learning', name: 'StudyBoard', jp: 'スタディボード', href: '../study-board/index.html',
      p: '複数科目を並行学習する社会人のための。ストリーク・ヒートマップ・バランス分析。' },
    { cat: 'learning', name: 'Daily English', jp: 'デイリーイングリッシュ', href: '../english-trainer/index.html',
      p: '瞬間英作文トレーナー。単語220・フレーズ135、4モード。通勤の合間に。' },
    { cat: 'learning', name: 'Turnaround 12', jp: 'ターンアラウンド12', href: '../turnaround12/index.html',
      p: '赤字クリニックを12週で立て直す経営シミュレーションゲーム。' },
    { cat: 'casual', name: 'Moyamoya Check', jp: '職場モヤモヤ診断', href: '../moyamoya/index.html',
      p: '職場の“なんとなくしんどい”を10問で言語化する診断。約3分・登録不要。' },
    { cat: 'casual', name: 'PMI Quest', jp: 'クリニックPMIクエスト', href: '../pmi-quest/index.html',
      p: '承継直後のクリニックで最初の30日に向き合う診断型ゲーム。' },
    { cat: 'casual', name: 'Ittan Horyu', jp: 'いったん保留', href: '../ittan-horyu/index.html',
      p: '買う前に、少しだけ寝かせる。衝動買いクールダウンアプリ。' },
    { cat: 'casual', name: 'KARTE', jp: '現場のカルテ', href: '../karte/index.html',
      p: '職場の“しんどさ”をSOAP形式のカルテに書き起こす診察型コンセプトページ。' },
    { cat: 'free', name: 'Reha Checklist', jp: 'リハ部門KPIチェックリスト', href: 'https://bridge-med.github.io/reha-checklist-lp/', ext: true,
      p: '外来リハKPI見える化スターターキット。PDF+スプレッドシート雛形を無料配布。' },
  ];
  const root = document.getElementById('catalog');
  CATS.forEach((c, ci) => {
    const items = PRODUCTS.filter(p => p.cat === c.id);
    if (!items.length) return;
    const sec = document.createElement('section');
    sec.className = 'sec' + (ci % 2 ? ' tint' : '');
    sec.id = c.id;
    sec.innerHTML =
      '<div class="cat-head" data-reveal><span class="n">' + String(ci + 1).padStart(2, '0') + ' — ' + items.length + ' tools</span>' +
      '<h2>' + c.t + '</h2><p>' + c.p + '</p></div>' +
      '<div class="prod-grid"></div>';
    const grid = sec.querySelector('.prod-grid');
    items.forEach((p, i) => {
      const a = document.createElement('a');
      a.className = 'prod-card';
      a.href = p.href;
      if (p.ext) { a.target = '_blank'; a.rel = 'noopener'; }
      a.setAttribute('data-reveal', '');
      a.setAttribute('data-reveal-delay', String(i % 3));
      a.innerHTML =
        '<span class="prod-num">' + c.t + '</span>' +
        '<div><div class="prod-name">' + p.name + '</div><div class="prod-jp">' + p.jp + '</div></div>' +
        '<p class="prod-p">' + p.p + '</p>' +
        '<span class="prod-link">見てみる →</span>';
      grid.appendChild(a);
    });
    root.appendChild(sec);
  });
  if (window.BRIDGE) window.BRIDGE.observeReveal();
});
</script>
