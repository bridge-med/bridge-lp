<style>
/* ================================================================
   Products v3 — 用途から選ぶ一覧。展示のように、大小のリズムで並べる
   色: --glass 系はこのページとトップだけ(shared/bridge.css 参照)。このページでは主ボタン相当(.use-nav は藍=既存の .tag.active と同じ選択状態)に留める
   ================================================================ */
.page-hero .lead{max-width:34em}
.page-hero .ph-h{font-family:var(--sans);font-weight:900;font-size:clamp(40px,7.6vw,96px);line-height:1.1;letter-spacing:-0.015em}
/* 用途の索引(ページ内リンク) */
.use-nav{max-width:var(--max);margin:clamp(28px,4vh,40px) auto 0;display:flex;flex-wrap:wrap;gap:8px;position:relative;z-index:1}
.use-nav a{font:600 12.5px/1 var(--sans);letter-spacing:0.03em;padding:13px 18px;min-height:44px;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:100px;color:var(--ink-2);background:var(--card);transition:all .25s}
.use-nav a:hover{border-color:var(--ink-3);color:var(--ink)}
.use-nav a.first{background:var(--blue);border-color:var(--blue);color:#fff}
[data-theme="dark"] .use-nav a.first{color:#08131E}
.use-nav a .n{font:700 9px/1 var(--en);letter-spacing:0.18em;color:var(--ink-4)}
.use-nav a.first .n{color:inherit;opacity:.7}
.use-nav a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* まず試すなら(3つ) */
.first-sec{padding-top:clamp(64px,9vh,100px);padding-bottom:clamp(64px,9vh,100px)}
.first-head{display:grid;grid-template-columns:1fr 1fr;gap:20px 48px;align-items:end;margin-bottom:clamp(28px,4vh,40px)}
.first-head h2{font-family:var(--sans);font-weight:900;font-size:clamp(28px,4vw,48px);line-height:1.2;letter-spacing:-0.01em;margin-top:16px}
.first-head p{font-size:13.5px;line-height:2.1;color:var(--ink-2);max-width:34em;justify-self:end}
.first-rows{border-top:1px solid var(--line)}
.first-row{display:grid;grid-template-columns:200px minmax(0,1fr) minmax(0,1.5fr) auto;gap:8px 28px;align-items:center;padding:clamp(16px,2.4vh,22px) 0;border-bottom:1px solid var(--line);transition:background .3s}
.first-row:hover{background:color-mix(in srgb,var(--blue) 4%,transparent)}
.first-row:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.first-row img{width:200px;height:auto;aspect-ratio:16/10;object-fit:cover;object-position:top;border:1px solid var(--line);border-radius:3px;background:var(--bg-3);display:block}
.first-row .t{font-family:var(--mincho);font-weight:600;font-size:clamp(17px,2vw,21px);line-height:1.6}
.first-row .t small{display:block;font:500 9.5px/1.6 var(--en);letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-3);margin-top:6px}
.first-row .d{font-size:13px;line-height:2;color:var(--ink-2)}
.first-row .c{font:700 12px/1 var(--sans);letter-spacing:0.04em;color:var(--blue);white-space:nowrap;display:inline-flex;gap:8px;align-items:center}
.first-row .c .ar{transition:transform .3s var(--ease)}
.first-row:hover .c .ar{transform:translateX(5px)}
@media(max-width:860px){
  .first-head{grid-template-columns:1fr}.first-head p{justify-self:start}
  .first-row{grid-template-columns:96px 1fr auto}
  .first-row img{width:96px}
  .first-row .d{grid-column:2/-1}
}

/* 用途ごとのセクション */
.cat-sec{padding-top:clamp(72px,10vh,120px);padding-bottom:clamp(72px,10vh,120px)}
.cat-head{max-width:var(--max);margin:0 auto clamp(30px,4vh,44px);display:grid;grid-template-columns:1fr 1fr;gap:16px 48px;align-items:end}
.cat-head .n{font:700 10px/1 var(--en);letter-spacing:0.24em;text-transform:uppercase;color:var(--ink-3);display:inline-flex;align-items:center;gap:10px}
.cat-head .n::before{content:'';width:22px;height:1px;background:var(--dawn)}
.cat-head h2{font-family:var(--sans);font-weight:900;font-size:clamp(28px,4vw,48px);line-height:1.2;letter-spacing:-0.01em;margin-top:16px}
.cat-head p{font-size:13.5px;line-height:2.1;color:var(--ink-2);max-width:34em;justify-self:end}
@media(max-width:860px){.cat-head{grid-template-columns:1fr}.cat-head p{justify-self:start}}
/* 展示のリズム: 6列グリッド。big=4列(写しが大きい)、通常=2列。3点以下の段はbigが3列 */
.prod-grid{max-width:var(--max);margin:0 auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:18px}
.prod-card{grid-column:span 2;background:var(--card);border:1px solid var(--line);border-radius:4px;display:flex;flex-direction:column;overflow:hidden;transition:border-color .35s var(--ease),transform .35s var(--ease)}
.prod-card.big{grid-column:span 4}
.prod-card.wide{grid-column:span 3}
a.prod-card:hover{transform:translateY(-3px);border-color:var(--blue-soft)}
a.prod-card:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.prod-fig{margin:0;overflow:hidden;border-bottom:1px solid var(--line);background:var(--bg-3)}
.prod-shot{width:100%;height:auto;aspect-ratio:16/10;object-fit:cover;object-position:top;display:block;transition:transform .6s var(--ease)}
.prod-card.big .prod-shot{aspect-ratio:16/9}
a.prod-card:hover .prod-shot{transform:scale(1.03)}
.prod-body{padding:20px 20px 22px;display:flex;flex-direction:column;gap:10px;flex:1}
.prod-card.big .prod-body{padding:clamp(22px,2.6vw,32px)}
.prod-k{font:600 10px/1.6 var(--en);letter-spacing:0.16em;text-transform:uppercase;color:var(--ink-3);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.prod-k .jp{font:600 10.5px/1.6 var(--sans);letter-spacing:0.06em;text-transform:none;color:var(--ink-3)}
.prod-t{font-family:var(--sans);font-weight:900;font-size:18px;line-height:1.4;letter-spacing:-0.005em}
.prod-card.big .prod-t{font-size:clamp(22px,2.6vw,30px)}
.prod-body .facts{margin-top:2px}
.prod-link{display:inline-flex;gap:8px;align-items:center;margin-top:4px;font:700 12px/1 var(--sans);letter-spacing:0.04em;color:var(--blue);border-bottom:1px solid var(--line);padding-bottom:5px;align-self:flex-start}
.prod-link .ar{transition:transform .3s var(--ease)}
a.prod-card:hover .prod-link .ar{transform:translateX(5px)}
@media(max-width:960px){
  .prod-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .prod-card,.prod-card.wide{grid-column:span 1}
  .prod-card.big{grid-column:span 2}
}
@media(max-width:600px){
  .prod-grid{grid-template-columns:1fr}
  .prod-card,.prod-card.big,.prod-card.wide{grid-column:span 1}

/* 一覧の末尾: 一文だけ */
.walk-note{max-width:34em}

      facts: ['登録不要', '入力の保存なし', '読みもの'] },
    { id: 'daily-app', use: 'career', t: '日々の仕事と学びを記録して、キャリアの言葉に', name: 'キャリアログ', img: 'careerlog.png', href: '../daily-app/index.html', cta: 'Web版を開く',

    { id: 'growth-76a805', use: 'career', t: '仕事の記録を、企画や発信のたねに', name: 'Growth OS', img: 'growth.png', href: '../growth-76a805/index.html', cta: '記録を始める',

    // ---- 学習を続ける ----
    { id: 'him-quiz', use: 'study', big: true, t: '診療情報管理士の模擬試験、全12章・360問', name: 'HIM Quiz', img: 'him-quiz.png', href: '../him-quiz/index.html', cta: '紹介を見る',
      facts: ['無料', 'ログイン不要', '端末内保存', 'スマホ対応'] },
    { id: 'study-board', use: 'study', t: '複数科目の学習を、1枚のボードで続ける', name: 'StudyBoard', img: 'studyboard.png', href: '../study-board/index.html', cta: '紹介とデモを見る',

      facts: ['無料', '登録不要', '端末内保存'] },
    { id: 'ittan-horyu', use: 'play', t: '買う前に、少しだけ寝かせる', name: 'いったん保留', en: 'Ittan Horyu', img: 'ittan-horyu.png', href: '../ittan-horyu/index.html', cta: '保留してみる',

    { id: 'futatsume', use: 'play', t: '二つの波が重なる、水面のパズル', name: 'ふたつめの波', en: 'Futatsume', img: 'futatsume.png', href: '../futatsume/index.html', cta: '遊ぶ',
      facts: ['無料', '登録不要', '端末内保存', 'ホーム画面に追加できる'] },
  ];

  const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
  const thumb = p => '../images/products/thumbs/' + p.img.replace('.png', '.webp');
  const byId = Object.fromEntries(PRODUCTS.map(p => [p.id, p]));
  const ctaOf = p => esc(p.cta) + (p.ext ? ' ↗' : '') + ' <span class="ar" aria-hidden="true">→</span>';
  const linkAttrs = p => 'href="' + esc(p.href) + '"' + (p.ext ? ' target="_blank" rel="noopener noreferrer"' : '');

  // 用途の索引(ページ内リンク)
  const nav = document.getElementById('useNav');
  nav.innerHTML = '<a class="first" href="#first">まず試すなら</a>' +
    USES.map((u, i) => '<a href="#' + u.id + '"><span class="n">' + String(i + 1).padStart(2, '0') + '</span>' + esc(u.t) + '</a>').join('');

  // まず試すなら(3点)
  const first = document.getElementById('firstRows');
  FIRST.map(id => byId[id]).filter(Boolean).forEach((p, i) => {
    const a = document.createElement('a');
    a.className = 'first-row'; a.href = p.href; a.setAttribute('data-reveal', ''); a.setAttribute('data-reveal-delay', String(i));
    a.innerHTML = '<img src="' + thumb(p) + '" alt="' + esc(p.name) + 'の画面" loading="lazy" width="880" height="550">' +
      '<span class="t">' + esc(p.name) + '<small>' + esc(p.en ? p.en + ' — ' : '') + esc(USES.find(u => u.id === p.use).t) + '</small></span>' +
      '<span class="d">' + esc(p.t) + '</span>' +
      '<span class="c">' + ctaOf(p) + '</span>';
    first.appendChild(a);
  });

  // 用途ごとのセクション
  const root = document.getElementById('catalog');
  USES.forEach((u, ui) => {
    const items = PRODUCTS.filter(p => p.use === u.id);
    if (!items.length) return;
    const sec = document.createElement('section');
    sec.className = 'sec cat-sec' + (ui % 2 ? ' tint' : '');
    sec.id = u.id;
    sec.setAttribute('aria-labelledby', 'cat-' + u.id);
    sec.innerHTML =
      '<div class="cat-head" data-reveal><div><span class="n">' + String(ui + 1).padStart(2, '0') + ' — ' + items.length + ' items</span>' +
      '<h2 id="cat-' + u.id + '">' + esc(u.t) + '</h2></div><p>' + esc(u.p) + '</p></div>' +
      '<div class="prod-grid"></div>';
    const grid = sec.querySelector('.prod-grid');
    items.forEach((p, i) => {
      const a = document.createElement('a');
      a.className = 'prod-card' + (p.big ? (items.length <= 3 ? ' wide' : ' big') : '');
      a.href = p.href;
      if (p.ext) { a.target = '_blank'; a.rel = 'noopener noreferrer'; }
      a.setAttribute('data-reveal', '');
      a.setAttribute('data-reveal-delay', String(i % 3));
      a.innerHTML =
        '<figure class="prod-fig"><img class="prod-shot" src="' + thumb(p) + '" alt="' + esc(p.name) + 'の画面" loading="lazy" width="880" height="550"></figure>' +
        '<div class="prod-body">' +
          '<span class="prod-k"><span class="jp">' + esc(p.name) + '</span>' + (p.en ? '<span>' + esc(p.en) + '</span>' : '') + (p.ext ? '<span class="jp">外部サイト</span>' : '') + '</span>' +
          '<h3 class="prod-t">' + esc(p.t) + '</h3>' +
          '<ul class="facts" aria-label="利用条件">' + p.facts.map(f => '<li>' + esc(f) + '</li>').join('') + '</ul>' +
          '<span class="prod-link">' + ctaOf(p) + '</span>' +
        '</div>';
      grid.appendChild(a);
    });
    root.appendChild(sec);
  });
  if (window.BRIDGE) window.BRIDGE.observeReveal();
});
</script>
