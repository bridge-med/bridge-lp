name: Weekly ledger refresh

# 週次レビュー便。台帳(cockpit)の最終更新日を毎週月曜7:00(JST)に焼き直す。
# 同じ便で販売経路を確かめ、cockpit-76a805/funnel.json に書く(確かめた日が入るので、毎週コミットが出る)。
# 社長承認済みの自動コミット(2026-07-15)。変更が出た週だけコミットする。

on:
  schedule:
    - cron: '0 22 * * 0' # 日曜22:00 UTC = 月曜7:00 JST
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: weekly-ledger
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # プロダクトごとの最終コミット日をgit logで引くため全履歴が要る
      - name: Refresh ledger
        run: node scripts/update-ledger.mjs
      - name: shiplog の月別集計(失敗率・差し戻し率・再発率)
        run: node scripts/shiplog-stats.mjs --out cockpit-76a805/drafts/shiplog-stats.md
      - name: 販売経路の検査(購入ボタンの行き先・価格の一致・note の最後の投稿)
        id: funnel
        # 切れていても台帳のコミットは止めない。結果を書いてから、最後のステップで落として知らせる
        run: node scripts/check-funnel.mjs --write || echo "broken=true" >> "$GITHUB_OUTPUT"
      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "変更なし。今週は静かなまま"
          else
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m 'chore(cockpit): 週次の鮮度焼き直し'
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Trigger Pages deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # GITHUB_TOKENのpushはpushイベントのworkflowを起こさないため、deployを明示的に呼ぶ
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches" \
            -d '{"ref":"master"}'
      - name: 販売経路が切れていたら、この便を失敗にして知らせる
        if: steps.funnel.outputs.broken == 'true'
        run: |
          echo "販売経路に切れている所があります。cockpit の SALES ROUTE と、この便の「販売経路の検査」の出力を見てください。"
          exit 1
