name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
        id: pages
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 公開の直前の機械検査。master は check.yml を待たずにここへ来るうえ、bot の push(GITHUB_TOKEN)では check.yml が起きない。
      # 落ちたら配信しない(前の版が出続ける)。sw.js の版名の比較は履歴が要るのでここでは見ない(check.yml と手元の hook が見る)
      - name: Check the site before publishing
        run: node scripts/check-site.mjs
      - name: Prepare URLs for the configured Pages domain
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: node scripts/prepare-pages.mjs "$PAGES_BASE_URL" "$RUNNER_TEMP/bridge-pages-${{ github.run_id }}-${{ github.run_attempt }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/bridge-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - id: deployment
        uses: actions/deploy-pages@v4
