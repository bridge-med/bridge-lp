<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>交差 — BRIDGE(about 名前の由来)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600&family=Noto+Sans+JP:wght@700;900&family=Inter:wght@500;800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:#111521;height:100%;overflow:hidden}
  html[data-theme="light"],html[data-theme="light"] body{background:#FBFAF7}
  canvas{display:block;position:absolute;inset:0;margin:auto;max-width:100vw;max-height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* ================================================================
   BRIDGE「交差」— 15.000 秒・60fps・無音。about「名前の由来」に置く版(2026-10-10)
   時刻 t だけで 1 枚が決まる(同じ t なら何度描いても同じ絵)。乱数は決定的な関数で。
   版: ?theme=light|dark(地はテーマのまま。夜→生成りの転換はしない=§2 テーマ別・designer 2026-10-09)
       &layout=wide|tall(wide=1920×1080・PC / tall=1080×1350・≤760px)
   書き出しは showreel/render.mjs --page showreel/kousa/reel.html --query 'theme=light&layout=wide'
   ================================================================ */
const Q = new URLSearchParams(location.search);
const THEME = Q.get('theme') === 'dark' ? 'dark' : 'light';
const TALL = Q.get('layout') === 'tall';
document.documentElement.setAttribute('data-theme', THEME);
const W = TALL ? 1080 : 1920, H = TALL ? 1350 : 1080, FPS = 60, DUR = 15;
const CX = W / 2, CY = H / 2, KS = TALL ? 0.75 : 1;   // KS: 文字とロゴの縮尺(tall は re + habilis と同じ 0.75)
const canvas = document.getElementById('c');
canvas.width = W; canvas.height = H; canvas.style.aspectRatio = `${W} / ${H}`; canvas.style.width = TALL ? 'min(100vw, 80vh)' : 'min(100vw, 177.78vh)';
const MAIN = canvas.getContext('2d');
/* 線の層: 筆の線と文字はこの層に描き、窓の端へ近づいた線だけを地へ溶かしてから地の上に重ねる。
   窓に縁を付けないので、線が窓の端で切れると見えない箱が見えてしまう(designer 2026-10-10)。地は平らな --bg のまま(グラデーションを足さない) */
const LAYER = document.createElement('canvas'); LAYER.width = W; LAYER.height = H;
const LCTX = LAYER.getContext('2d');
let ctx = LCTX;
const EDGE = Math.round(Math.min(W, H) * 0.14);   // 端から 14% の帯で線を 1→0 に(1080 で 151px)
const MASK = (() => {
  const m = document.createElement('canvas'); m.width = W; m.height = H;
  const mc = m.getContext('2d'), img = mc.createImageData(W, H), d = img.data;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const u = Math.min(x, W - 1 - x, y, H - 1 - y) / EDGE;
    const a = u >= 1 ? 1 : u <= 0 ? 0 : u * u * (3 - 2 * u);
    d[(y * W + x) * 4 + 3] = Math.round(a * 255);
  }
  mc.putImageData(img, 0, 0); return m;
})();

/* ---- easing ---- */
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, u) => a + (b - a) * u;
const E = {
  lin: u => u,
  cubicIn: u => u * u * u,
  cubicOut: u => 1 - Math.pow(1 - u, 3),
  cubicInOut: u => u < .5 ? 4 * u * u * u : 1 - Math.pow(2 - 2 * u, 3) / 2,
  expoOut: u => u >= 1 ? 1 : 1 - Math.pow(2, -10 * u),
  expoInOut: u => u <= 0 ? 0 : u >= 1 ? 1 : u < .5 ? Math.pow(2, 20 * u - 10) / 2 : (2 - Math.pow(2, -20 * u + 10)) / 2,
  sineInOut: u => (1 - Math.cos(Math.PI * u)) / 2,
};
/* サイトの --ease = cubic-bezier(.16,1,.3,1) を LUT で */
E.ease = (() => {
  const bx = s => 3 * (1 - s) * (1 - s) * s * .16 + 3 * (1 - s) * s * s * .3 + s * s * s;
  const by = s => 3 * (1 - s) * (1 - s) * s + 3 * (1 - s) * s * s + s * s * s;
  const N = 2048, lut = new Float32Array(N + 1);
  for (let i = 0; i <= N; i++) { const u = i / N; let lo = 0, hi = 1; for (let k = 0; k < 40; k++) { const m = (lo + hi) / 2; if (bx(m) < u) lo = m; else hi = m; } lut[i] = by((lo + hi) / 2); }
  return u => { if (u <= 0) return 0; if (u >= 1) return 1; const f = u * N, i = Math.floor(f); return lut[i] + (lut[i + 1] - lut[i]) * (f - i); };
})();
const seg = (t, a, d, e = E.lin) => e(clamp((t - a) / d));   // 区間 [a, a+d] の進み 0→1

/* ---- 決定的な乱数(種から同じ列) ---- */
const hash = (i, k = 0) => { let x = (i * 374761393 + k * 668265263) >>> 0; x = ((x ^ (x >>> 13)) * 1274126177) >>> 0; return ((x ^ (x >>> 16)) >>> 0) / 4294967296; };

/* ---- 色(サイトのトークンの値) ---- */
/* ライトは bridge.css のライト値、ダークはダーク値(地 --bg・--bg-2、藍の線の役割 --mark-line=ダークでは --ink、砂 --dawn) */
const C = THEME === 'dark'
  ? { bg: '#111521', bg2: '#161B2B', navy: '#EDEAE2', blue: '#9FB1D4', blueSoft: '#5A6C92', sand: '#C2A97E', ink: '#EDEAE2', ink2: '#C2BFB6', fore: '#EDEAE2' }
  : { bg: '#FBFAF7', bg2: '#F4EFE6', navy: '#16233E', blue: '#24365C', blueSoft: '#8B9BBC', sand: '#A98F63', ink: '#1B1B1E', ink2: '#45464C', fore: '#16233E' };

/* ---- 書体 ---- */
const F = { jp: (w, s) => `${w} ${s}px "Noto Sans JP"`, min: (w, s) => `${w} ${s}px "Shippori Mincho B1"`, en: (w, s) => `${w} ${s}px "Inter"` };

/* ---- ロゴの二本の線(shared/bridge.js の MARK と同じパス。viewBox 240×110) ---- */
const LOGO = { navy: [[8, 74], [62, 16], [118, 24], [176, 84]], sand: [[58, 94], [118, 60], [158, 22], [232, 12]] };
const bez = (p, u) => { const a = 1 - u; return [a * a * a * p[0][0] + 3 * a * a * u * p[1][0] + 3 * a * u * u * p[2][0] + u * u * u * p[3][0], a * a * a * p[0][1] + 3 * a * a * u * p[1][1] + 3 * a * u * u * p[2][1] + u * u * u * p[3][1]]; };

/* ================================================================
   draw(t): 時刻 t の 1 枚を canvas に描く(純粋関数)
   ================================================================ */

/* ================================================================
   案B「筆」— 流れ場をたどる軌跡が筆のように線を書く
   粒 N 本を 120Hz で 20 秒ぶん先に積分しておく(決定的)。draw(t) は表を読むだけ。
   ================================================================ */
const N = 1200, SR = 120, STEPS = DUR * SR + 3, K = 26;   // 粒は 1800→1200(容量 1版 2MB 以下のため画の密度を減らす。B-21・designer 2026-10-10)
const T_MS = 9.0;   // 収束の開始(粒ごとに +0.8 秒まで散らす)
const PX = new Float32Array(N * STEPS), PY = new Float32Array(N * STEPS), BR = new Uint8Array(N * STEPS);
const BS = new Int32Array(N), Z = new Float32Array(N), U0 = new Float32Array(N), OFF = new Float32Array(N), MS = new Float32Array(N);
const CUR = new Uint8Array(N), SAND = new Uint8Array(N);
const frac = x => x - Math.floor(x);

/* 流れ場の時間変化(向き・乱れ・速さ) */
const theta0 = t => -0.14 + 1.05 * E.ease(seg(t, 4.0, 0.9)) - 1.25 * E.ease(seg(t, 6.0, 1.6));
const ampF = t => 0.06 + 1.1 * E.cubicInOut(seg(t, 2.2, 2.2)) - 0.55 * E.sineInOut(seg(t, 6.2, 1.5));
const spdF = t => 420 + 200 * E.sineInOut(seg(t, 3.0, 1.8)) - 330 * E.sineInOut(seg(t, 6.0, 2.0));
function fieldAngle(x, y, t, z, th, am) {
  const n = Math.sin(x * 0.0023 + t * 0.35 + z * 5.1) * Math.cos(y * 0.0031 - t * 0.3 + z * 2.0)
    + 0.65 * Math.sin(x * 0.0014 - y * 0.0027 + t * 0.55 + z * 3.3)
    + 0.35 * Math.sin(y * 0.0065 + x * 0.0011 - t * 0.9 + z * 1.7);
  return th + am * n * 0.85;
}
(function precompute() {
  const TH = new Float32Array(STEPS), AM = new Float32Array(STEPS), SP = new Float32Array(STEPS);
  for (let j = 0; j < STEPS; j++) { const t = j / SR; TH[j] = theta0(t); AM[j] = ampF(t); SP[j] = spdF(t); }
  for (let i = 0; i < N; i++) {
    const h1 = hash(i, 1);
    const birth = i === 0 ? 0 : i < 330 ? 0.3 + 2.3 * Math.pow(h1, 1.6) : 2.6 + 2.6 * h1;   // i=0 は 0.0 秒からの一点(先導)。5.2 秒までに全粒が生まれる
    BS[i] = Math.floor(birth * SR);
    Z[i] = i === 0 ? 0.95 : hash(i, 2);
    U0[i] = hash(i, 3);
    OFF[i] = hash(i, 5) + hash(i, 6) - 1;
    MS[i] = T_MS + 0.8 * U0[i];                    // 収束の開始は曲線上の u(左→右)の順。9.8 秒までに全粒が動き出す
    CUR[i] = hash(i, 7) < 0.15 ? 1 : 0;           // 15% は砂の線へ収束(砂になるのは収束してから)
    SAND[i] = hash(i, 8) < 0.01 ? 1 : 0;           // 流れの間の砂は 1%
    let x = i === 0 ? -8 : -20, y = CY + (i === 0 ? 0 : (hash(i, 4) - 0.5) * 14);
    const base = i * STEPS;
    for (let j = BS[i]; j < STEPS; j++) {
      if (j > BS[i]) {
        const a = fieldAngle(x, y, (j - 1) / SR, Z[i], TH[j - 1], AM[j - 1]);
        const v = SP[j - 1] / SR * (i === 0 && j < 0.3 * SR ? 0.35 : 1);   // 先導の粒は 0.3 秒までゆっくり、束が追いつく
        x += Math.cos(a) * v; y += Math.sin(a) * v;
        let br = 0;
        if (x > W + 90) { x -= W + 180; br = 1; } else if (x < -90) { x += W + 180; br = 1; }
        if (y > H + 90) { y -= H + 180; br = 1; } else if (y < -90) { y += H + 180; br = 1; }
        BR[base + j] = br;
      }
      PX[base + j] = x; PY[base + j] = y;
    }
  }
})();

/* 色の補間 */
const hex2 = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (a, b, u) => { const A = hex2(a), B = hex2(b); return `rgb(${Math.round(lerp(A[0], B[0], u))},${Math.round(lerp(A[1], B[1], u))},${Math.round(lerp(A[2], B[2], u))})`; };
const rgba = (h, a) => { const A = hex2(h); return `rgba(${A[0]},${A[1]},${A[2]},${a})`; };
/* 帯(band): 0 奥 / 1 中 / 2 手前 / 3 砂 / 4 収束・藍 / 5 収束・砂。地はテーマで固定(palette は 1 つ) */
const BAND = [
  [[C.blueSoft, .55], [C.blue, .7], [C.fore, .9], [C.sand, .8], [C.fore, .7], [C.sand, .75]],
];
const ORDER = [0, 1, 3, -1, 2, 4, 5];   // -1 の位置で見出し文字を描く(奥・中・砂の上、手前の線だけが文字の前を横切る)

/* ロゴのカメラ(収束中は大きく、引いて最終の大きさへ) */
const S0 = 6.2 * KS, S1 = 2.2 * KS, CY1 = CY - 130 * KS;
const logoS = t => lerp(S0, S1, E.ease(seg(t, 9.4, 3.6)));
const logoCY = t => lerp(CY, CY1, E.ease(seg(t, 9.4, 3.6)));
function logoPt(c, u, s, cy) { const p = bez(c ? LOGO.sand : LOGO.navy, u); return [CX + (p[0] - 120) * s, cy + (p[1] - 55) * s]; }
function logoNormal(c, u) { const P = c ? LOGO.sand : LOGO.navy; const a = bez(P, Math.max(0, u - .01)), b = bez(P, Math.min(1, u + .01)); const dx = b[0] - a[0], dy = b[1] - a[1]; const l = Math.hypot(dx, dy) || 1; return [-dy / l, dx / l]; }

/* 画面のカメラ(ドリーとパララックス) */
const zoomF = t => 1 + 0.2 * E.sineInOut(seg(t, 2.5, 2.5)) - 0.2 * E.sineInOut(seg(t, 6.0, 2.5));
/* 見出し(about の stmt と同じ言葉。tall は本文と同じ位置で二行) */
const HEAD = TALL ? ['分かれてしまったものの間に、', '橋を架ける'] : ['分かれてしまったものの間に、橋を架ける'];
const HFS = TALL ? 52 : 64, HLH = TALL ? 72 : 0;

const widthIdx = w => clamp(Math.round(Math.log2(w / 0.5) * 2), 0, 12);
const widthOf = idx => 0.5 * Math.pow(2, idx / 2);

function draw(t) {
  /* ---- 地: テーマの --bg のまま、平らに(転換もグラデーションもしない。§1・§4「地は --bg の窓」designer 2026-10-10) ---- */
  MAIN.setTransform(1, 0, 0, 1, 0, 0); MAIN.globalAlpha = 1; MAIN.globalCompositeOperation = 'source-over';
  MAIN.fillStyle = C.bg; MAIN.fillRect(0, 0, W, H);
  ctx = LCTX;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.clearRect(0, 0, W, H);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';

  /* ---- 軌跡 ---- */
  const buckets = new Map();   // key -> {path, band, pal, w, aq}  aq: 粒ごとの不透明度(4 段階)
  const bucketsThick = new Map();
  /* 見出しの矩形の中では手前の粒を薄くする(8.0–8.6 で 1→0.25、見出しが消えるときに戻す) */
  const dimP = 0.75 * seg(t, 6.0, 0.6) * (1 - seg(t, 9.4, 0.4));
  if (t < 13.4) {
    const jf = t * SR, j = Math.min(STEPS - 2, Math.floor(jf)), f = jf - j;
    const zoom = zoomF(t), camx = 60 * Math.sin(t * 0.5), camy = 25 * Math.sin(t * 0.37 + 1);
    const hx0 = CX - 630 * KS, hx1 = CX + 630 * KS, hy0 = CY - 90 * KS - HLH / 2, hy1 = CY + 90 * KS + HLH / 2;   // 見出しの矩形
    const wphase = 1.4 - 0.4 * E.sineInOut(seg(t, 2.0, 2.5));
    const pts = new Float32Array(K * 2);
    for (let i = 0; i < N; i++) {
      if (BS[i] > j) continue;
      const base = i * STEPS, z = Z[i], par = 0.3 + 0.7 * z;
      const sL = logoS(t), cyL = logoCY(t);
      let n = 0, prevU = -1, mHead = 0, headSpeed = 400, hx = 0, hy = 0;
      /* 粒ごとの不透明度: 終わりは奥→手前の順に消える(清書線が手前から浮き上がる) */
      let am = 1 - E.ease(seg(t, 12.0 + 0.6 * z, 0.5));
      if (am <= 0.02) continue;
      const mH = E.ease(seg(t, MS[i], 2.2)), spreadH = (1 - E.ease(seg(t, 10.2, 3.0))) * 3 * OFF[i] * KS;   // 散らしは 3(8 では粒子の効果に見える。designer 2026-10-10)
      /* 収束中も軌跡の長さは保つ(縮めると短い粒に見える。束が細る絵にする) */
      const Ki = K;
      if (mH > 0) {
        /* u が 1→0 へ戻った直後は、切れた軌跡を描かず新しく生まれる扱い(0.15 秒で 0→1) */
        const uh = frac(U0[i] + 0.3 * (t - T_MS));
        if (uh < 0.045) am *= uh / 0.045;
      }
      for (let k = 0; k < Ki; k++) {
        const idx = j - k;
        if (idx < BS[i]) break;
        if (k > 0 && BR[base + idx + 1]) break;
        let wx, wy, tau;
        if (k === 0) {
          if (BR[base + idx + 1]) { wx = PX[base + idx]; wy = PY[base + idx]; }
          else { wx = lerp(PX[base + idx], PX[base + idx + 1], f); wy = lerp(PY[base + idx], PY[base + idx + 1], f); }
          tau = t;
          if (idx > BS[i] && !BR[base + idx]) headSpeed = Math.hypot(PX[base + idx] - PX[base + idx - 1], PY[base + idx] - PY[base + idx - 1]) * SR;
        } else { wx = PX[base + idx]; wy = PY[base + idx]; tau = idx / SR; }
        let sx = (wx - CX - camx * par) * zoom + CX, sy = (wy - CY - camy * par) * zoom + CY;
        const m = mH;   // 軌跡全体が一つの筆として吸い込まれる(点ごとに違う進みにすると棘になる)
        if (m > 0) {
          const u = frac(U0[i] + 0.3 * (tau - T_MS));
          if (prevU >= 0 && Math.abs(u - prevU) > 0.5) break;
          prevU = u;
          const s = k === 0 ? sL : logoS(tau), cy = k === 0 ? cyL : logoCY(tau);
          const L = logoPt(CUR[i], u, s, cy), nrm = logoNormal(CUR[i], u);
          const spread = spreadH * s;
          sx = lerp(sx, L[0] + nrm[0] * spread, m); sy = lerp(sy, L[1] + nrm[1] * spread, m);
        }
        if (k === 0) { mHead = m; hx = sx; hy = sy; }
        pts[n * 2] = sx; pts[n * 2 + 1] = sy; n++;
      }
      if (n < 2) continue;
      /* 幅: 奥は細く、速いほど細く。収束でロゴの線幅へ */
      const w0 = (0.7 + 1.9 * z) * clamp(400 / headSpeed, 0.5, 1.6) * wphase;
      const w = lerp(w0, 6 * sL * 0.28, mHead);
      const band = mHead > 0.5 ? (CUR[i] ? 5 : 4) : (SAND[i] ? 3 : z < .4 ? 0 : z < .75 ? 1 : 2);
      if (dimP > 0 && hx > hx0 && hx < hx1 && hy > hy0 && hy < hy1) {
        if (band === 2 && hash(i, 10) < 0.85) am *= 1 - dimP;         // 手前: 85% を 1→0.25(重なりが濃いので 60% では沈まない)
        else if (band === 1 && hash(i, 10) < 0.5) am *= 1 - dimP * 0.6;   // 中: 50% を 1→0.55(明朝の細い画が沈まないように)
      }
      const aq = Math.round(am * 4); if (aq <= 0) continue;
      const pal = 0;
      const wi = widthIdx(w), key = ((band * 2 + pal) * 16 + wi) * 5 + aq;
      let b = buckets.get(key); if (!b) { b = { path: new Path2D(), band, pal, w: widthOf(wi), aq }; buckets.set(key, b); }
      b.path.moveTo(pts[0], pts[1]);
      for (let k = 1; k < n; k++) b.path.lineTo(pts[k * 2], pts[k * 2 + 1]);
      /* 筆の腹: 先の半分を太く */
      if (n >= 4 && mHead < 0.5) {
        const wi2 = widthIdx(w * 1.8), key2 = ((band * 2 + pal) * 16 + wi2) * 5 + aq;
        let b2 = bucketsThick.get(key2); if (!b2) { b2 = { path: new Path2D(), band, pal, w: widthOf(wi2), aq }; bucketsThick.set(key2, b2); }
        const n2 = Math.max(2, Math.floor(n * 0.45));
        b2.path.moveTo(pts[0], pts[1]);
        for (let k = 1; k < n2; k++) b2.path.lineTo(pts[k * 2], pts[k * 2 + 1]);
      }
    }
  }
  const strokeBand = band => {
    for (const M of [buckets, bucketsThick]) for (const b of M.values()) {
      if (b.band !== band) continue;
      const [col, al] = BAND[b.pal][band];
      ctx.strokeStyle = col; ctx.globalAlpha = al * (b.aq / 4) * (M === bucketsThick ? 0.75 : 1); ctx.lineWidth = b.w;
      ctx.stroke(b.path);
    }
  };
  for (const band of ORDER) {
    if (band >= 0) { strokeBand(band); continue; }
    /* ---- 見出し: 一文字ずつ、筆で書くように左から現れる ---- */
    const fade = 1 - E.ease(seg(t, 9.4, 0.4));
    if (t > 6.3 && t < 9.8 && fade > 0) {
      const fs = HFS, sp = fs * 0.08;   // 第23条: 見出しは明朝(Shippori Mincho B1 600)。字間 0.08em
      ctx.font = F.min(600, fs); ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
      let gi = 0;
      HEAD.forEach((str, li) => {
        const ws = [...str].map(ch => ctx.measureText(ch).width);
        const total = ws.reduce((a, b) => a + b, 0) + (str.length - 1) * sp;
        let x = CX - total / 2;
        const y = CY + (li - (HEAD.length - 1) / 2) * HLH;
        [...str].forEach((ch, i) => {
          const a = E.ease(seg(t, 6.4 + gi * 0.12, 0.8)); gi++;
          if (a > 0) {
            ctx.save(); ctx.beginPath(); ctx.rect(x - 4, y - fs * 1.25, (ws[i] + 8) * a, fs * 2.5); ctx.clip();
            ctx.globalAlpha = a * fade; ctx.fillStyle = C.ink;
            ctx.fillText(ch, x, y + (1 - a) * 22 * KS - (1 - fade) * 6);
            ctx.restore();
          }
          x += ws[i] + sp;
        });
      });
    }
  }
  ctx.globalAlpha = 1;

  /* ---- 収束したロゴの二本の線(交差するが接続しない) ---- */
  const la = E.ease(seg(t, 11.9, 0.8));
  if (la > 0) {
    const s = logoS(t), cy = logoCY(t);
    ctx.globalAlpha = la; ctx.lineWidth = 6 * s; ctx.lineCap = 'round';
    for (const c of [0, 1]) {
      const P = c ? LOGO.sand : LOGO.navy;
      ctx.strokeStyle = c ? C.sand : C.navy;
      ctx.beginPath();
      const p0 = logoPt(c, 0, s, cy); ctx.moveTo(p0[0], p0[1]);
      ctx.bezierCurveTo(CX + (P[1][0] - 120) * s, cy + (P[1][1] - 55) * s, CX + (P[2][0] - 120) * s, cy + (P[2][1] - 55) * s, CX + (P[3][0] - 120) * s, cy + (P[3][1] - 55) * s);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  /* ---- BRIDGE / EXPAND CHOICES. ---- */
  const brY = CY1 + 39 * S1 + 150 * KS + 84 * KS * 0.727;   // ロゴ下端(cy+39s)とキャップ高(84×0.727)の間隔 150px
  const ba = E.ease(seg(t, 12.4, 0.8));
  if (ba > 0) {
    ctx.globalAlpha = ba; ctx.fillStyle = C.ink; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.font = F.en(800, 84 * KS);
    ctx.fillText('BRIDGE', CX, brY + (1 - ba) * 28 * KS);
    ctx.globalAlpha = 1;
  }
  const ea = E.ease(seg(t, 12.7, 0.8));
  if (ea > 0) {
    ctx.globalAlpha = ea; ctx.fillStyle = C.ink2; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.font = F.en(500, 26 * KS);
    const str = 'EXPAND CHOICES.', sp = 26 * KS * 0.32;
    const ws = [...str].map(ch => ctx.measureText(ch).width);
    const total = ws.reduce((a, b) => a + b, 0) + (str.length - 1) * sp;
    let x = CX - total / 2;
    [...str].forEach((ch, i) => { ctx.fillText(ch, x, brY + 59 * KS + (1 - ea) * 20 * KS); x += ws[i] + sp; });
    ctx.globalAlpha = 1;
  }
  /* ---- 線の層を、端で地へ溶かしてから地の上に重ねる ---- */
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'destination-in'; ctx.drawImage(MASK, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  MAIN.drawImage(LAYER, 0, 0);
}

/* ---- 動きのぼけ: サブフレームを平均(累積の canvas に移動平均で重ねる) ---- */
const acc = document.createElement('canvas'); acc.width = W; acc.height = H;
const actx = acc.getContext('2d');
function renderFrame(t, maxSamples = 8) {
  const n = Math.max(1, Math.min(maxSamples, 8));
  if (n <= 1) { draw(t); window.REEL.out = canvas; return 1; }
  actx.setTransform(1, 0, 0, 1, 0, 0); actx.globalCompositeOperation = 'source-over'; actx.globalAlpha = 1; actx.clearRect(0, 0, W, H);
  const shutter = 0.5 / FPS;   // 180° シャッター
  for (let i = 0; i < n; i++) { draw(t + shutter * ((i + .5) / n - .5)); actx.globalAlpha = 1 / (i + 1); actx.drawImage(canvas, 0, 0); }
  actx.globalAlpha = 1;
  window.REEL.out = acc; return n;
}

/* ---- 準備: 使う文字をフォントごとに先読み ---- */
const TEXTS = {
  [F.min(600, 40)]: HEAD.join(''),
  [F.en(800, 40)]: 'BRIDGE',
  [F.en(500, 40)]: 'EXPAND CHOICES.',
};
const ready = (async () => {
  await document.fonts.ready;
  await Promise.all(Object.entries(TEXTS).map(([f, s]) => document.fonts.load(f, s)));
  const missing = Object.entries(TEXTS).filter(([f, s]) => !document.fonts.check(f, s)).map(([f]) => f);
  if (missing.length) throw new Error('フォントが揃っていない: ' + missing.join(', '));
})();

window.REEL = { W, H, FPS, DUR, canvas, draw, renderFrame, ready, out: canvas };

/* ---- プレビュー(?render なしで開いたとき): 実時間で再生。クリックで頭から。?t=秒 で静止 ---- */
if (!location.search.includes('render')) {
  ready.then(() => {
    const q = new URLSearchParams(location.search);
    if (q.has('t')) { draw(+q.get('t')); return; }
    let start = performance.now();
    const loop = now => { draw(((now - start) / 1000) % DUR); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
    canvas.addEventListener('click', () => { start = performance.now(); });
  });
}
</script>
</body>
</html>
